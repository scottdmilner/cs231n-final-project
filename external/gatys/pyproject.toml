[project]
name = "gatys"
version = "0.1.0"
description = "Python module implementation of https://github.com/leongatys/PytorchNeuralStyleTransfer"
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.2.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
]

[build-system]
requires = [
    "hatchling", 
    "requests",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gatys"]

[tool.hatch.build.hooks.custom]
